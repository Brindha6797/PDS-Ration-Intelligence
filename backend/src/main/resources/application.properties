# ====================================================================
# PDS RATION SHOP STOCK & ENTITLEMENT SYSTEM - APPLICATION PROPERTIES
# ====================================================================

spring.application.name=pds-ration-intelligence-backend
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# Oracle Database Configuration via Environment Variables with sensible defaults
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:pds_admin}
spring.datasource.password=${DB_PASSWORD:PdsAdmin2026#Secure}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Authentication
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Python AI Intelligence Microservice Connector
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/api/v1/ai}

# Logging
logging.level.root=INFO
logging.level.com.wipro.pds=DEBUG
logging.level.org.springframework.security=INFO
